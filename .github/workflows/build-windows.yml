name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release on tag push

jobs:
  build:
    name: Build + Test (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Load MSVC + Windows SDK env (link.exe, cl.exe, INCLUDE, LIB, PATH).
      # Without this, cargo can't find link.exe on a fresh windows-latest.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # IMPORTANT: these cargo steps must NOT run under `shell: bash`.
      # Git Bash (the only bash on windows-latest) prepends its own
      # usr/bin to PATH ahead of the MSVC toolchain, so rustc's call to
      # `link.exe` resolves to Git's coreutils `link.exe` (a symlink
      # tool) instead of MSVC's linker, and every link step fails with
      # "/usr/bin/link: extra operand". pwsh (the Windows-runner default
      # shell) respects the PATH ordering ilammy/msvc-dev-cmd set up.
      - name: Show toolchain + linker
        shell: pwsh
        run: |
          Write-Host "rustc: $(rustc --version)"
          Write-Host "cargo: $(cargo --version)"
          $link = Get-Command link.exe -ErrorAction SilentlyContinue
          if ($link) { Write-Host "link.exe: OK ($($link.Source))" } else { Write-Host "link.exe: MISSING" }
          $cl = Get-Command cl.exe -ErrorAction SilentlyContinue
          if ($cl) { Write-Host "cl.exe:  OK ($($cl.Source))" } else { Write-Host "cl.exe:  MISSING" }

      - name: cargo check (fast dep-resolution gate)
        shell: pwsh
        run: |
          cargo check --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build-check.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cargo check failed"
            exit 1
          }

      - name: Build release binary (with log capture)
        shell: pwsh
        run: |
          cargo build --release --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::cargo build failed — see build-log artifact"
            exit 1
          }

      - name: Always-upload build logs (success or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Copy artifact to repo root
        shell: pwsh
        run: Copy-Item target/x86_64-pc-windows-msvc/release/epos-emulator.exe epos-emulator.exe

      - name: Run tests (host arch)
        run: cargo test --lib --release --no-fail-fast

      - name: Verify --list-printers enumerates real Windows printers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = .\epos-emulator.exe --list-printers | Out-String
          Write-Host $out
          if ($out -match "FakePrinter") {
            throw "enum_printers() returned the non-Windows stub on a Windows runner"
          }
          if ($out -notmatch "Microsoft Print to PDF") {
            throw "expected the standard 'Microsoft Print to PDF' printer (ships on every windows-latest runner) in the list"
          }
          Write-Host "OK: real printer enumeration works"

      - name: Upload .exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: epos-emulator-windows-x64
          path: epos-emulator.exe
          if-no-files-found: error
          retention-days: 14

      - name: Verify SOAP round-trip against the built binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "epos-emulator.exe"
          $proc = Start-Process -FilePath ".\$exe" -ArgumentList "--port","18080" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/" -TimeoutSec 2 | Out-Null
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            $resp = Invoke-WebRequest -UseBasicParsing -Method POST `
              -Uri "http://127.0.0.1:18080/cgi-bin/epos/service.cgi?devid=ci" `
              -ContentType "text/xml; charset=utf-8" `
              -InFile "testdata/odoo-pos-test-print.xml"
            Write-Host "POST status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content)"
            if ($resp.StatusCode -ne 200) { throw "expected 200, got $($resp.StatusCode)" }
            if ($resp.Content -notmatch '<response\b') { throw "expected an epos-print <response> element in body" }
            # The CI runner has no physical printer installed, so the spooler
            # call itself is expected to fail with OpenPrinter — that still
            # proves the XML/SOAP round-trip (parse -> translate -> respond)
            # worked correctly. A real success="true" is also fine (e.g. if
            # a default printer somehow exists). Anything else (XML parse
            # error, translate error, malformed response) is a real bug.
            if ($resp.Content -match 'success="true"') {
              Write-Host "OK: SOAP round-trip succeeded (printed)"
            } elseif ($resp.Content -match 'OpenPrinter failed|not available on this platform') {
              Write-Host "OK: SOAP round-trip succeeded (no physical printer on CI runner; XML parsed/translated correctly)"
            } else {
              throw "unexpected response body: $($resp.Content)"
            }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Attach .exe to GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: epos-emulator.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
