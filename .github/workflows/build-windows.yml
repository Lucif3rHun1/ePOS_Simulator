name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release on tag push

jobs:
  build:
    name: Build + Test (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Show toolchain + MSVC env
        shell: bash
        run: |
          echo "=== rustc ===" && rustc --version
          echo "=== cargo ===" && cargo --version
          echo "=== rustup ===" && rustup show
          echo "=== link.exe ===" && (command -v link.exe || which link.exe || echo "link.exe NOT FOUND")
          echo "=== cl.exe ===" && (command -v cl.exe || which cl.exe || echo "cl.exe NOT FOUND")
          echo "=== MSVC env ===" && (cmd //c "call \"C:\\Program Files (x86)\\Microsoft Visual Studio\\2022\\BuildTools\\VC\\Auxiliary\\Build\\vcvars64.bat\" >nul 2>&1 && set" 2>/dev/null | grep -E "^(VCINSTALLDIR|VCToolsInstallDir|WindowsSdkDir|UCRTVersion)=" | head -10) || echo "vcvars64.bat not callable from this path"

      - name: Build release binary (with log capture)
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --target x86_64-pc-windows-msvc -v 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "cargo exit status: $status"
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo build failed (status=$status) — see build.log artifact"
            exit "$status"
          fi

      - name: Always-upload build log (success or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Copy artifact to repo root
        shell: bash
        run: cp target/x86_64-pc-windows-msvc/release/epos-emulator.exe epos-emulator.exe

      - name: Run tests (host arch)
        run: cargo test --lib --release --no-fail-fast

      - name: Upload .exe as workflow artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: epos-emulator-windows-x64
          path: epos-emulator.exe
          if-no-files-found: error
          retention-days: 14

      - name: Verify SOAP round-trip against the built binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "epos-emulator.exe"
          $proc = Start-Process -FilePath ".$exe" -ArgumentList "--port","18080" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/" -TimeoutSec 2 | Out-Null
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            $resp = Invoke-WebRequest -UseBasicParsing -Method POST `
              -Uri "http://127.0.0.1:18080/cgi-bin/epos/service.cgi?devid=ci" `
              -ContentType "text/xml; charset=utf-8" `
              -InFile "testdata/odoo-pos-test-print.xml"
            Write-Host "POST status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content)"
            if ($resp.StatusCode -ne 200) { throw "expected 200, got $($resp.StatusCode)" }
            if ($resp.Content -notmatch "success") { throw "expected success in body" }
            Write-Host "OK: SOAP round-trip succeeded"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Attach .exe to GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: epos-emulator.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
