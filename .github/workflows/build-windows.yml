name: build-windows

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release on tag push

jobs:
  build:
    name: Build + Test (Windows MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Load MSVC + Windows SDK env (link.exe, cl.exe, INCLUDE, LIB, PATH).
      # Without this, cargo can't find link.exe on a fresh windows-latest.
      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Show toolchain + linker
        shell: bash
        run: |
          echo "rustc: $(rustc --version)"
          echo "cargo: $(cargo --version)"
          command -v link.exe >/dev/null && echo "link.exe: OK ($(command -v link.exe))" || echo "link.exe: MISSING"
          command -v cl.exe >/dev/null && echo "cl.exe:  OK ($(command -v cl.exe))" || echo "cl.exe:  MISSING"

      - name: cargo check (fast dep-resolution gate)
        shell: bash
        run: |
          set -e
          cargo check --release --target x86_64-pc-windows-msvc 2>&1 | tee build-check.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::cargo check failed"
            exit 1
          fi

      - name: Build release binary (with log capture)
        shell: bash
        run: |
          set -e
          cargo build --release --target x86_64-pc-windows-msvc 2>&1 | tee build.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::cargo build failed — see build-log artifact"
            exit 1
          fi

      - name: Always-upload build logs (success or fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-check.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Copy artifact to repo root
        shell: bash
        run: cp target/x86_64-pc-windows-msvc/release/epos-emulator.exe epos-emulator.exe

      - name: Run tests (host arch)
        run: cargo test --lib --release --no-fail-fast

      - name: Upload .exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: epos-emulator-windows-x64
          path: epos-emulator.exe
          if-no-files-found: error
          retention-days: 14

      - name: Verify SOAP round-trip against the built binary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "epos-emulator.exe"
          $proc = Start-Process -FilePath ".$exe" -ArgumentList "--port","18080" -PassThru -NoNewWindow
          Start-Sleep -Seconds 2
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:18080/" -TimeoutSec 2 | Out-Null
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }
            $resp = Invoke-WebRequest -UseBasicParsing -Method POST `
              -Uri "http://127.0.0.1:18080/cgi-bin/epos/service.cgi?devid=ci" `
              -ContentType "text/xml; charset=utf-8" `
              -InFile "testdata/odoo-pos-test-print.xml"
            Write-Host "POST status: $($resp.StatusCode)"
            Write-Host "Body: $($resp.Content)"
            if ($resp.StatusCode -ne 200) { throw "expected 200, got $($resp.StatusCode)" }
            if ($resp.Content -notmatch "success") { throw "expected success in body" }
            Write-Host "OK: SOAP round-trip succeeded"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Attach .exe to GitHub release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: epos-emulator.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
