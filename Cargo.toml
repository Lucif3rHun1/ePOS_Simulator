[package]
name = "epos-emulator"
version = "2.1.3"
edition = "2021"
rust-version = "1.75"
authors = ["Lucif3rHun1"]
license = "MIT"
description = "Epson ePOS printer emulator for Odoo Online POS (Windows service that impersonates a network printer and forwards to a local USB ESC/POS printer via the Windows spooler RAW path)"
repository = "https://github.com/Lucif3rHun1/ePOS_Simulator"
readme = "README.md"

[[bin]]
name = "epos-emulator"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server (axum is the de facto std for tokio)
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }


# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# XML parsing (ePOS-Print elements + SOAP envelope)
quick-xml = { version = "0.36", features = ["serialize"] }

# Encoding
base64 = "0.22"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging + structured fields
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "1"
anyhow = "1"

# Atomic ops / concurrent state
parking_lot = "0.12"

# LAN service discovery (mDNS/Bonjour/DNS-SD) so phones/apps on the same
# WiFi network can find this printer without knowing its IP.
mdns-sd = "0.20"

# Single-byte OEM/DOS codepage transcoding (CP437, CP850, etc) for <text>
# content — ESC/POS printers read bytes >= 0x80 per their active
# character table, not UTF-8.
oem_cp = "2.1.2"

# Windows FFI for winspool is written directly in src/winspool.rs using
# #[link(name = "winspool", kind = "raw-dylib")] so we don't need windows-sys
# or windows-targets at all.

# Reduce binary size for release builds
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
pretty_assertions = "1"

[lib]
name = "epos_emulator"
path = "src/lib.rs"
